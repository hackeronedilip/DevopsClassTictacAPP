name: CI/CD Pipeline

on:
  push:
    branches:
      - test

jobs:
  build_and_scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      # --------------------------
      # Checkout Code
      # --------------------------
      - name: Checkout code from the repo
        uses: actions/checkout@v2

      # --------------------------
      # Node Setup
      # --------------------------
      - name: Setup Node.js Environment
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install Dependencies
        run: npm install

      # --------------------------
      # SonarQube Scanner Setup
      # --------------------------
      - name: Install SonarQube Scanner
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.6.2.2472-linux.zip
          unzip sonar-scanner.zip -d /opt
          echo "/opt/sonar-scanner-4.6.2.2472-linux/bin" >> $GITHUB_PATH

      - name: Run SonarQube Analysis
        run: |
          sonar-scanner \
            -Dsonar.projectKey=Tictac-App \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # --------------------------
      # AWS Auth for ECR (us-east-1)
      # --------------------------
      - name: Setup AWS Credentials (ECR Region)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR (us-east-1)
        uses: aws-actions/amazon-ecr-login@v1

      # --------------------------
      # Build Docker Image
      # --------------------------
      - name: Build Docker Image
        id: build_image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=${COMMIT_SHA::7}
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/tictac:$SHORT_SHA"

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          echo "Building Docker image: $IMAGE"
          docker build -t $IMAGE .

      # --------------------------
      # Trivy Security Scan
      # --------------------------
      - name: Scan the Docker Image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: "${{ env.IMAGE }}"
          format: 'sarif'
          output: 'docker-result.sarif'
          scan-type: image
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # --------------------------
      # Push Image ONLY on Successful Scan
      # --------------------------
      - name: Push Docker Image
        if: success()
        run: |
          echo "Pushing Docker image: $IMAGE"
          docker push $IMAGE

      # --------------------------
      # Configure EKS (ap-south-1)
      # --------------------------
      - name: Setup AWS Credentials (EKS Region)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Configure kubectl for EKS
        run: |
          kubectl config set-cluster ${{ secrets.EKS_NAME }} --server=${{ secrets.EKS_ENDPOINT }} --certificate-authority=ca.crt

          kubectl config set-credentials github-user --token=${{ secrets.EKS_TOKEN }}

          kubectl config set-context ${{ secrets.EKS_NAME }} --cluster=${{ secrets.EKS_NAME }} --user=github-user --namespace=default

          kubectl config use-context ${{ secrets.EKS_NAME }}

      # # --------------------------
      # # Deploy to Kubernetes
      # # --------------------------
      - name: Deploy to Kubernetes
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          echo "Deploying image: $IMAGE to EKS cluster: ${{ secrets.EKS_NAME }}"

          kubectl set image deployment/tictac-deployment \
            tictac=$IMAGE --record

          echo "Waiting for rollout to finish..."
          kubectl rollout status deployment/tictac-deployment
