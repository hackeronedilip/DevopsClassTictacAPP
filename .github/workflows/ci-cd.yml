name: CI/CD Pipeline

on:
  push:
    branches:
      - test

jobs:
  build_and_scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      # --------------------------
      # Checkout Code
      # --------------------------
      - name: Checkout code
        uses: actions/checkout@v2

      # --------------------------
      # Node Setup
      # --------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install Dependencies
        run: npm install

      # --------------------------
      # SonarQube Scanner
      # --------------------------
      - name: Install SonarQube Scanner
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.6.2.2472-linux.zip
          unzip sonar-scanner.zip -d /opt
          echo "/opt/sonar-scanner-4.6.2.2472-linux/bin" >> $GITHUB_PATH

      - name: Run SonarQube Analysis
        run: |
          sonar-scanner \
            -Dsonar.projectKey=Tictac-App \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # --------------------------
      # AWS Credentials for ECR
      # --------------------------
      - name: Configure AWS Credentials for ECR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # --------------------------
      # Build Docker Image
      # --------------------------
      - name: Build Docker Image
        id: build_image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=${COMMIT_SHA::7}
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/tictac:$SHORT_SHA"

          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          echo "Building Docker image: $IMAGE"
          docker build -t $IMAGE .

      # --------------------------
      # Trivy Security Scan
      # --------------------------
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: "${{ env.IMAGE }}"
          format: 'sarif'
          output: 'docker-result.sarif'
          scan-type: image
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # --------------------------
      # Push Docker Image if Scan Succeeds
      # --------------------------
      - name: Push Docker Image
        if: success()
        run: |
          echo "Pushing Docker image: $IMAGE"
          docker push $IMAGE

      # --------------------------
      # AWS Credentials for EKS
      # --------------------------
      - name: Configure AWS Credentials for EKS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # --------------------------
      # Configure kubectl for EKS
      # --------------------------
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.EKS_NAME }} \
            --region ap-south-1 \
            --alias tictac-eks

      # --------------------------
      # Deploy to Kubernetes
      # --------------------------
      - name: Deploy to Kubernetes
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          echo "Deploying image: $IMAGE to EKS cluster: ${{ secrets.EKS_NAME }}"

          # Update deployment image
          kubectl set image deployment/tictac-deployment tictac=$IMAGE

          # Wait for rollout
          echo "Waiting for rollout to finish..."
          kubectl rollout status deployment/tictac-deployment
