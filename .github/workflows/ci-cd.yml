name: CI/CD Pipeline

on:
  push:
    branches:
      - test

jobs:
  build_and_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from the repo
        uses: actions/checkout@v2

      - name: Setup Node.js Environment
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install Dependencies
        run: npm install
